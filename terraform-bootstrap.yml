AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bootstrap infrastructure for Terraform remote state: S3 bucket and DynamoDB table'

Parameters:

  BucketNamePrefix:
    Type: String
    Description: Prefix for the S3 bucket name
    Default: dens-al

  DynamoDBTableNamePrefix:
    Type: String
    Description: Prefix for the DynamoDB table name
    Default: dens-al

  GitHubOrg:
    Type: String
    Description: GitHub organization name
    Default: dens-al

  GitHubRepo:
    Type: String
    Description: GitHub repository name or pattern (can use * for all repos)
    Default: aws-terraform-gh-actions-bootstrap

  GitHubRoleName:
    Type: String
    Description: Name for the IAM role that GitHub Actions will assume
    Default: GitHubActionsRole

Resources:
  # S3 Bucket for Terraform State
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}-tf-state"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Created-By
          Value: CloudFormation-bootstrap
        - Key: Purpose
          Value: Terraform-State

  # S3 Bucket Policy
  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # S3 and DynamoDB Access Policy
  TerraformBackendAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: TerraformBackendAccess
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
            Resource: !GetAtt TerraformLockDynamoDBTable.Arn

  # DynamoDB Table for Terraform State Locking
  TerraformLockDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${DynamoDBTableNamePrefix}-${AWS::AccountId}-${AWS::Region}-terraform-state-lock"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      Tags:
        - Key: Managed-By
          Value: CloudFormation-bootstrap
        - Key: Purpose
          Value: Terraform-State-Locking

  # GitHub OIDC Provider
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - "6938fd4d98bab03faadb97b34396831e3780aea1"
      Tags:
        - Key: Managed-By
          Value: CloudFormation-bootstrap
        - Key: Purpose
          Value: GitHub-Actions-OIDC

  # IAM Role for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref GitHubRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Tags:
        - Key: Managed-By
          Value: CloudFormation-bootstrap
        - Key: Purpose
          Value: GitHub-Actions

Outputs:
  TerraformStateBucketName:
    Description: Name of the S3 bucket for Terraform state
    Value: !Ref TerraformStateBucket

  TerraformStateBucketARN:
    Description: ARN of the S3 bucket for Terraform state
    Value: !GetAtt TerraformStateBucket.Arn

  TerraformLockDynamoDBTableName:
    Description: Name of the DynamoDB table for Terraform state locking
    Value: !Ref TerraformLockDynamoDBTable

  TerraformLockDynamoDBTableARN:
    Description: ARN of the DynamoDB table for Terraform state locking
    Value: !GetAtt TerraformLockDynamoDBTable.Arn

  GitHubActionsRoleARN:
    Description: ARN of the IAM role for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn

  GitHubOIDCProviderARN:
    Description: ARN of the GitHub OIDC provider
    Value: !GetAtt GitHubOIDCProvider.Arn

  BackendConfigSnippet:
    Description: Terraform backend configuration snippet
    Value: !Sub |
      terraform {
        backend "s3" {
          bucket         = "${TerraformStateBucket}"
          key            = "terraform.tfstate"
          region         = "${AWS::Region}"
          dynamodb_table = "${TerraformLockDynamoDBTable}"
          encrypt        = true
        }
      }

  GitHubActionsWorkflowSnippet:
    Description: GitHub Actions workflow snippet for AWS authentication
    Value: !Sub |
      name: Terraform Deployment
      
      on:
        push:
          branches: [ main ]
        pull_request:
          branches: [ main ]
          
      permissions:
        id-token: write
        contents: read
        pull-requests: write
      
      jobs:
        terraform:
          name: Terraform
          runs-on: ubuntu-latest
          steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.5.0
              
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                role-to-assume: ${GitHubActionsRole.Arn}
                aws-region: ${AWS::Region}
              
            - name: Terraform Init
              id: init
              run: terraform init
              
            - name: Terraform Plan
              id: plan
              run: terraform plan -out=tfplan -no-color
              continue-on-error: true
              
            - name: Terraform Apply
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: terraform apply -auto-approve tfplan